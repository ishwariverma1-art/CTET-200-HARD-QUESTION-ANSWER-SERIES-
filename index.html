let paper=Object.keys(BANKS)[0], questions=[], idx=0, score=0, answered=new Set();

function initTabs(){
 const t=document.getElementById('tabs'); t.innerHTML='';
 Object.keys(BANKS).forEach(p=>{let b=document.createElement('button');b.className='tab'+(p===paper?' active':'');b.textContent=p;b.onclick=()=>{paper=p;restart()};t.appendChild(b)})
 const s=document.getElementById('subject'); [...new Set(BANKS[paper].map(x=>x.subject))].forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o)})
 s.onchange=()=>{restart()}
}
function filtered(){
 const s=document.getElementById('subject').value;
 return BANKS[paper].filter(x=>s==='ALL'||x.subject===s);
}
function restart(){idx=0;score=0;answered=new Set();questions=filtered();render();initTabs()}
function shuffleQuestions(){questions=[...filtered()].sort(()=>Math.random()-.5);idx=0;score=0;answered=new Set();render()}
function render(){
 if(!questions.length) return;
 const x=questions[idx]; document.getElementById('counter').textContent=`प्रश्न ${idx+1} / ${questions.length} • ${x.subject}`;
 document.getElementById('score').textContent=`Score: ${score}`;
 document.getElementById('bar').style.width=((idx+1)/questions.length*100)+'%';
 const app=document.getElementById('app'); app.innerHTML='';
 const c=document.createElement('div');c.className='card';
 c.innerHTML=`<div class="qno">Question ${idx+1}</div><h2 style="font-size:20px;line-height:1.5">${x.q}</h2>`;
 x.options.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${o}`;b.onclick=()=>answer(i,b);c.appendChild(b)});
 const e=document.createElement('div');e.className='explain';e.id='exp';e.innerHTML=`<b>सही उत्तर:</b> ${String.fromCharCode(65+x.answer)}<br><b>Concept:</b> ${x.concept}`;c.appendChild(e);app.appendChild(c);
}
function answer(i,btn){
 const x=questions[idx]; if(answered.has(idx)) return; answered.add(idx);
 [...btn.parentElement.querySelectorAll('.option')][x.answer].classList.add('correct');
 if(i===x.answer) score++; else btn.classList.add('wrong');
 document.getElementById('exp').style.display='block'; document.getElementById('score').textContent=`Score: ${score}`;
}
function next(){if(idx<questions.length-1){idx++;render()}}
function prev(){if(idx>0){idx--;render()}}
initTabs(); restart();

const LABELS = {"Hindi": "हिंदी", "CPD": "CPD • बाल विकास एवं शिक्षाशास्त्र", "Sanskrit": "संस्कृत", "SST": "सामाजिक विज्ञान", "English": "English", "Science": "विज्ञान", "Math": "गणित"};
let subject="Hindi", current=[];

function tabs(){
  document.getElementById("tabs").innerHTML=Object.keys(LABELS).map(s =>
    `<button class="${s===subject?'active':''}" onclick="setSubject('${s}')">${LABELS[s]}</button>`
  ).join("");
}
function setSubject(s){
  subject=s;
  document.getElementById("score").classList.add("hidden");
  tabs(); render(BANKS[s]);
}
function render(arr){
  current=arr;
  document.getElementById("quiz").innerHTML=arr.map((x,i)=>`
  <article class="card">
    <div class="qhead"><span>प्रश्न ${i+1}</span><span class="tag">🔥 IMPORTANT</span></div>
    <h3>${x.q}</h3>
    <div class="options">
      ${x.options.map((o,j)=>`
        <button class="option option-${j}" data-q="${i}" data-a="${j}" onclick="choose(this)">
          <span class="letter">${String.fromCharCode(65+j)}</span> ${o}
        </button>`).join("")}
    </div>
    <div class="feedback" id="fb-${i}"></div>
    <div class="concept">
      <div class="concept-title">💡 छोटा Concept</div>
      <div>${x.concept}</div>
    </div>
  </article>`).join("");
}
function choose(btn){
  const q=Number(btn.dataset.q), a=Number(btn.dataset.a), x=current[q];
  const opts=document.querySelectorAll(`.option[data-q="${q}"]`);
  opts.forEach(b=>b.disabled=true);
  opts.forEach(b=>{
    if(Number(b.dataset.a)===x.answer){
      b.classList.add("correct");
      b.innerHTML=`<span class="letter">✓</span> ${b.textContent.replace(/^.${1}\s*/,"").trim()}`;
    }
  });
  const fb=document.getElementById("fb-"+q);
  if(a===x.answer){
    btn.classList.add("correct");
    fb.className="feedback right";
    fb.textContent="🎉 बिल्कुल सही उत्तर!";
  } else {
    btn.classList.add("wrong");
    fb.className="feedback wrongfb";
    fb.textContent="❌ गलत उत्तर — सही विकल्प Green में दिखाया गया है";
  }
}
document.getElementById("random").onclick=()=>{
  const a=[...BANKS[subject]].sort(()=>Math.random()-.5).slice(0,20);
  render(a); window.scrollTo({top:0,behavior:"smooth"});
};
document.getElementById("all").onclick=()=>render(BANKS[subject]);
document.getElementById("answers").onclick=()=>{
  document.querySelectorAll(".option").forEach(b=>{
    const q=Number(b.dataset.q), a=Number(b.dataset.a);
    if(a===current[q].answer) b.classList.add("correct");
  });
};
document.getElementById("search").oninput=e=>{
  const t=e.target.value.toLowerCase();
  render(BANKS[subject].filter(x=>x.q.toLowerCase().includes(t)||x.concept.toLowerCase().includes(t)));
};
tabs(); render(BANKS[subject]);
</script>
</body>
</html>
